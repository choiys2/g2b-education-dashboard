name: 처리방침 협력사 수집(점검용)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python policy_partners_scrape.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/policy_partners.json
          git diff --cached --quiet || git commit -m "chore: 처리방침 협력사 수집 $(date -u +%F)"
          git pull --rebase origin main
          git push
