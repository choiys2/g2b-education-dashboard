name: 교사 커뮤니티 동향(매일)

# 교사 트렌드 2027 최상단 '오늘의 교사 커뮤니티 핵심' + 관리 칸 '📡 커뮤니티 동향'.
# 공개·공식 경로만: 네이버 검색 API(뉴스·블로그·카페, 약 51회/일) · YouTube Data API(약 110유닛/일) · Gemini 무료 등급 1회/일.
# 인스타그램·페이스북은 쿠키 수집을 하지 않는다(사용자 결정 2026-11-24). 결과는 다음 06:00 배포에 반영된다.
on:
  schedule:
    - cron: "20 20 * * *"   # 매일 05:20 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: teacher-pulse
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 교사 커뮤니티 동향 수집·핵심 메시지
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python teacher_pulse.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/teacher_pulse.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: 교사 커뮤니티 동향 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
