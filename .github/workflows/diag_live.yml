name: diag live fetch
on:
  push:
    branches: [diag-live]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p diag
          curl -sSL -D diag/gh_headers.txt "https://choiys2.github.io/g2b-education-dashboard/" -o diag/gh_index.html || true
          curl -sSL -D diag/cf_headers.txt "https://vs-insight.pages.dev/" -o diag/cf_index.html || true
          ls -la diag
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diag && git commit -m "diag: live fetch" && git push
