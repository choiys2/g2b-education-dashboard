name: 경쟁사 연수과정 카탈로그 크롤링

on:
  schedule:
    - cron: "0 21 * * 0"   # 매주 월요일 06:00 KST (UTC 일요일 21:00) - 나라장터 대시보드 일일 배포(06:00 KST)와 겹치지 않게 같은 시각대에 맞춤
  workflow_dispatch:
    inputs:
      max_items:
        description: "사이트별 최대 수집 건수"
        default: "500"
      sites:
        description: "쉼표구분 (비우면 3사 전체)"
        default: ""
  # ⚠️ schedule/workflow_dispatch는 워크플로 파일이 기본 브랜치(main)에 있어야만
  # 실제로 실행된다(GitHub 제약) - main 병합 전까지는 위 두 트리거가 이 브랜치에서는
  # 동작하지 않고, 대신 이 브랜치에 push될 때도 실행되게 해서 검증한다.
  # main 병합 후에는 이 push 트리거를 제거해도 된다.
  push:
    branches: [claude/opensource-api-dashboard-f3o7q7]
    paths:
      - "competitor_course_catalog_scrape.py"
      - "catalog_field_parser.py"
      - "debug_dump_catalog_html.py"
      - ".github/workflows/course_catalog.yml"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # 로그인 없이 보이는 공개 목록 페이지만 본다(robots.txt는 스크립트가 실행 시 재확인).
      - name: 3사 직무연수 카탈로그 크롤링
        run: |
          MAX_ITEMS="${{ inputs.max_items }}"
          SITES="${{ inputs.sites }}"
          python competitor_course_catalog_scrape.py \
            --max-items "${MAX_ITEMS:-500}" \
            --sites "${SITES}" \
            --debug

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/competitor_course_catalog.json
          git diff --cached --quiet || git commit -m "chore: 경쟁사 연수과정 카탈로그 크롤링 $(date -u +%F)"
          git push
