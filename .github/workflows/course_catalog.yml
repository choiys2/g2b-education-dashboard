name: 경쟁사 연수과정 카탈로그 수동 크롤링

on:
  workflow_dispatch:
    inputs:
      max_items:
        description: "사이트별 최대 수집 건수"
        default: "500"
      sites:
        description: "쉼표구분 (비우면 3사 전체)"
        default: ""
  # workflow_dispatch는 워크플로 파일이 기본 브랜치(main)에 있어야만 API로 실행할 수
  # 있어서, main 병합 전 이 브랜치에서 바로 검증하기 위해 push 트리거를 임시로 둔다.
  # main 병합 후에는 이 push 트리거를 제거해도 된다(workflow_dispatch만으로 충분).
  push:
    branches: [claude/opensource-api-dashboard-f3o7q7]
    paths:
      - "competitor_course_catalog_scrape.py"
      - "debug_dump_catalog_html.py"
      - ".github/workflows/course_catalog.yml"

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      # ⚠️ 임시: 실제 강좌 카드 DOM 구조를 확인하기 위해 진단 덤프를 먼저 돈다.
      # 정상 크롤링(competitor_course_catalog_scrape.py)으로 되돌리기 전까지만 유지.
      - name: "[임시진단] 3사 목록 페이지 렌더링 DOM 덤프"
        run: python debug_dump_catalog_html.py

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug_html/
          git diff --cached --quiet || git commit -m "chore: 진단용 DOM 덤프 $(date -u +%F)"
          git push
