name: 조간 브리핑 지면 갱신·배포

# briefings/ 에 새 호가 들어오면 신문 지면만 다시 만들어 배포한다.
# 나라장터 OpenAPI는 호출하지 않으므로, G2B가 죽은 날에도 브리핑은 정상 갱신된다.
on:
  push:
    branches: [main]
    paths:
      - "briefings/**"
      - "build_news_briefing.py"
      - "news_api_export.py"
      - "widget/**"
      - "news_ai.py"
      - ".github/workflows/news.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# deploy.yml 과 같은 그룹을 써서 두 배포가 서로 밟지 않게 한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.assemble.outputs.deployable }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gemini 3줄 요약(실패해도 지면 배포는 진행). 이 워크플로는 커밋하지 않으므로 다음 정기 배포가 history 에 남긴다.
      - name: 조간 브리핑 AI 요약 (Gemini)
        timeout-minutes: 3
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_ai.py briefings

      - name: 신문 지면 생성 (표준 라이브러리만 사용)
        run: |
          python build_news_briefing.py briefings live/news
          python news_api_export.py briefings live/api/news

      - uses: actions/configure-pages@v5
        id: pages

      # Pages는 저장소당 배포본이 하나라, 여기서 _site를 통째로 새로 올리면
      # 대시보드가 사라진다. 이 워크플로는 대시보드를 만들 수 없으므로(=API 미호출)
      # 지금 떠 있는 배포본을 그대로 내려받아 news/ 만 갈아끼운 뒤 다시 올린다.
      # 대시보드 회수에 실패하면 배포를 건너뛴다 — 빈 사이트로 덮어쓰는 사고 방지.
      - name: 현재 배포본 회수 + news/ 교체
        id: assemble
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
        run: |
          set -u
          mkdir -p _site/full
          curl -fsSL --retry 3 --retry-delay 2 "$SITE/"              -o _site/index.html      || true
          curl -fsSL --retry 3 --retry-delay 2 "$SITE/full/"         -o _site/full/index.html || true
          curl -fsSL --retry 3 --retry-delay 2 "$SITE/full/calendar.ics" -o _site/full/calendar.ics || true
          curl -fsSL --retry 3 --retry-delay 2 "$SITE/full/report.pdf"   -o _site/full/report.pdf   || true
          cp static_data/ai_schools_2026.xlsx _site/full/ai_schools_2026.xlsx 2>/dev/null || true
          curl -fsSL --retry 3 --retry-delay 2 "$SITE/full/weekly.html"      -o _site/full/weekly.html      || true
          curl -fsSL --retry 3 --retry-delay 2 "$SITE/full/weekly_mail.txt"  -o _site/full/weekly_mail.txt  || true
          curl -fsSL --retry 3 --retry-delay 2 "$SITE/full/b2s_schools.csv"  -o _site/full/b2s_schools.csv  || true
          find _site -type f -empty -delete

          if [ ! -s _site/index.html ]; then
            echo "::warning::기존 대시보드($SITE)를 회수하지 못해 배포를 건너뜁니다. 다음 06:00 정기 배포에서 함께 반영됩니다."
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp -r live/news _site/news
          # 대시보드 배포본에 이미 있던 api/ 는 회수하지 않고 여기서 새로 만든 뉴스 API로 채운다
          # (api/ 에는 현재 뉴스만 있으므로 브리핑 원본에서 재생성하면 동일하다).
          cp -r live/api _site/api
          cp -r widget _site/widget
          echo "deployable=true" >> "$GITHUB_OUTPUT"
          echo "회수한 파일:"; find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        if: steps.assemble.outputs.deployable == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
