name: 조간 브리핑 지면 갱신·배포

# briefings/ 에 새 호가 들어오면 신문 지면만 다시 만들어 배포한다.
# 나라장터 OpenAPI는 호출하지 않으므로, G2B가 죽은 날에도 브리핑은 정상 갱신된다.
on:
  push:
    branches: [main]
    paths:
      - "briefings/**"
      - "build_news_briefing.py"
      - "news_api_export.py"
      - "widget/**"
      - "news_ai.py"
      - ".github/workflows/news.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# deploy.yml 과 같은 그룹을 써서 두 배포가 서로 밟지 않게 한다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.assemble.outputs.deployable }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Gemini 3줄 요약(실패해도 지면 배포는 진행). 이 워크플로는 커밋하지 않으므로 다음 정기 배포가 history 에 남긴다.
      - name: 조간 브리핑 AI 요약 (Gemini)
        timeout-minutes: 3
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_ai.py briefings

      - name: 신문 지면 생성 (표준 라이브러리만 사용)
        run: |
          python build_news_briefing.py briefings live/news
          python news_api_export.py briefings live/api/news

      - uses: actions/configure-pages@v5
        id: pages

      # 공개 GitHub 주소에는 대시보드를 두지 않는다(대시보드는 이메일 로그인 뒤 Cloudflare 에만).
      # 여기서는 조간 지면·뉴스 API·위젯과, 지금 떠 있는 입찰 마감 캘린더(calendar.ics)만 다시 올린다.
      # 캘린더 회수에 실패하면 배포를 건너뛴다 — 구독 중인 캘린더가 비는 사고 방지(06:00 정기 배포가 반영).
      # Cloudflare 사본은 통째로 교체되는 구조라 여기서 올리지 않는다(대시보드 안 뉴스 위젯은 GitHub 뉴스 API를 읽음).
      - name: 공개 사이트 조립 (뉴스·API·위젯·캘린더)
        id: assemble
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          set -u
          curl -fsSL --retry 3 --retry-delay 2 "$SITE/full/calendar.ics" -o calendar.ics || true
          if [ ! -s calendar.ics ]; then
            echo "::warning::기존 캘린더($SITE/full/calendar.ics)를 회수하지 못해 배포를 건너뜁니다. 다음 06:00 정기 배포에서 함께 반영됩니다."
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python gh_public_site.py _site live/news live/api widget calendar.ics
          python add_noindex.py _site   # 검색엔진 비노출
          echo "deployable=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v3
        if: steps.assemble.outputs.deployable == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
