name: KERIS 조달(입찰·개찰·낙찰) 수집

on:
  schedule:
    - cron: "10 20 * * *"   # 매일 05:10 KST - 06:00 대시보드 배포 전에 끝나도록
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keris
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 매 실행: 최근 60일 재조회 + 과거 1년씩 백필(3년 목표, 키: G2B_SERVICE_KEY)
      - name: 설정 파일 준비(키는 환경변수로 덮어씀)
        run: cp g2b_config.example.json g2b_config.json
      # 시간이 넘쳐도 단계별로 저장된 결과는 커밋되도록(다음 실행이 이어서 백필)
      - name: KERIS 나라장터 조달 수집
        timeout-minutes: 18
        continue-on-error: true
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python keris_export.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f history/keris_procurement.json ] && git add history/keris_procurement.json
          git diff --cached --quiet || git commit -m "chore: KERIS 조달 수집 $(date -u +%F)"
          git pull --rebase origin main
          git push
