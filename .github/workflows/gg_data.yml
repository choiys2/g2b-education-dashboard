name: 경기데이터드림 B2S 수집

# B2S 경기 31개 시군: 학교·학생 수(학교 현황) + 학원·교습소(경기데이터드림) 시군 집계
on:
  schedule:
    - cron: "40 18 * * 0"   # 매주 월요일 03:40 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: gg-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 경기 시군 집계
        env:
          GG_DATA_KEY: ${{ secrets.GG_DATA_KEY }}
        run: python gg_data.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/gg_b2s.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: 경기 B2S 시군 집계 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
