name: 나라장터 대시보드 자동 갱신·배포

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00 전날)
  workflow_dispatch:
    inputs:
      competitor_days:
        description: "경쟁사 낙찰 조회 기간(일). 평소 60, 과거분 재수집(백필)은 730"
        required: false
        default: "60"
  push:
    branches: [main]
    # 브리핑 데이터만 바뀐 푸시는 news.yml 이 전담한다. 두 워크플로가 같은 push 로
    # 동시에 뜨면 concurrency 그룹(pages)에서 뒤에 대기하던 쪽이 취소되는데,
    # 실측 결과 매번 news.yml 이 취소되고 무거운 이 파이프라인이 대신 배포했다.
    # (2026-08-16: news.yml #4~#7 전부 cancelled)
    paths-ignore:
      - "briefings/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 2026-09-27: 나라장터 API가 응답 없이 매달려 수집 단계가 2시간 40분 넘게 멈췄고,
    # 그동안 뒤의 배포가 전부 대기·취소됐다. 단계별 상한을 두고 넘으면 배포를 건너뛴다
    # (어제 배포본이 그대로 유지됨 - 건전성 체크 실패와 같은 효과).
    timeout-minutes: 120
    outputs:
      data_healthy: ${{ steps.healthcheck.outputs.healthy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: |
          pip install openpyxl reportlab PublicDataReader playwright google-auth olefile
          sudo apt-get update -y && sudo apt-get install -y fonts-nanum
          python -m playwright install --with-deps chromium

      - name: prepare local config (service key comes from secret at runtime)
        run: cp g2b_config.example.json g2b_config.json

      # 2026-09-27~28 하루 새 3회: 나라장터 API가 응답 없이 매달려 40분 상한에 걸렸고,
      # 매번 수동 재실행하면 13분 만에 정상 완료됐다(일시 장애). 25분 넘으면 끊고 1회 자동 재시도.
      - name: fetch G2B data + build 기존 단독 대시보드
        timeout-minutes: 55
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: |
          for attempt in 1 2; do
            timeout 25m python run_pipeline.py && exit 0
            echo "::warning::G2B 수집 ${attempt}차 시도 실패 또는 25분 초과"
            [ "$attempt" = 1 ] && sleep 60
          done
          exit 1

      # 2026-08-03 실측: data.go.kr(나라장터 API)가 4시간 넘게 응답 없이 타임아웃돼
      # 입찰공고/사전규격/낙찰정보가 전부 0건으로 수집됐는데, continue-on-error 때문에
      # 그 빈 데이터가 그대로 배포돼 전날까지 멀쩡하던 사이트가 통째로 비어버렸다.
      # 재발 방지: 오늘 수집량이 비정상적으로 적으면(임계치 미만) 배포 자체를 건너뛰고
      # 어제까지 이미 떠 있는 GitHub Pages 콘텐츠를 그대로 둔다(live/는 gitignore라
      # "어제 버전으로 롤백"할 파일이 없으므로, 배포를 안 하는 것 자체가 롤백이 된다).
      - name: G2B 데이터 건전성 체크
        id: healthcheck
        run: python check_g2b_health.py

      # ---- 통합 대시보드(나이스+G2B+선도학교+자사파이프라인) 확장 파이프라인 ----
      # NEIS_KEY / ODCLOUD_KEY 시크릿이 없으면 이 스텝들은 개별적으로 실패해도
      # continue-on-error로 넘어가고, 기존 단독 대시보드만 배포된다(하위 호환).
      - name: G2B 분석 데이터 export (analytics.py 재사용, 스크레이핑 없음)
        continue-on-error: true
        run: python g2b_full_export.py live/full_live.json live/g2b_full_export.json

      - name: 나이스 학교수 + AI 선도학교(odcloud) export
        timeout-minutes: 30
        continue-on-error: true
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          ODCLOUD_KEY: ${{ secrets.ODCLOUD_KEY }}
        run: python neis_full_export.py live/neis_full_export.json

      - name: 자사 영업 파이프라인 export (안전 필드만, 담당자 익명화)
        continue-on-error: true
        env:
          GOOGLE_SHEETS_SA_JSON: ${{ secrets.GOOGLE_SHEETS_SA_JSON }}
        run: python own_pipeline_export.py live/own_pipeline_export.json

      # '26타사DT' -> B2G 연수 배너(수의계약 포함) 자사·타사 테마·지역 교차 분석
      - name: 연수 배너 시장(자사·타사) 분석
        continue-on-error: true
        timeout-minutes: 5
        env:
          GOOGLE_SHEETS_SA_JSON: ${{ secrets.GOOGLE_SHEETS_SA_JSON }}
        run: python banner_market.py live/banner_market.json

      # '26영업소통 DT' -> 사업별 소통 숫자 지표만(원문·이름·연락처·문장 요약은 저장/게시/외부 AI 전송 안 함)
      - name: 사업별 소통·진행 분석
        continue-on-error: true
        timeout-minutes: 10
        env:
          GOOGLE_SHEETS_SA_JSON: ${{ secrets.GOOGLE_SHEETS_SA_JSON }}
        run: python pipeline_comms.py live/pipeline_comms.json

      - name: KOSIS 시도교육청 교육재정 규모 export
        continue-on-error: true
        run: python kosis_edu_finance.py "${{ secrets.KOSIS_KEY }}" live/kosis_edu_finance.json

      # 경쟁사(티처빌/아이스크림/비바샘연수원/한교원) 나라장터 낙찰 - history/competitor_wins.jsonl에
      # 누적(git 추적, live/처럼 매일 지워지지 않음). 매일은 최근 60일치만 조회(낙찰 데이터가
      # 뒤늦게 등록되는 경우를 감안해 겹치게), 대시보드에는 누적 전체를 집계해 보여준다.
      - name: 경쟁사 나라장터 낙찰 매트릭스 export (누적)
        timeout-minutes: 30
        continue-on-error: true
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python competitor_g2b_export.py --days ${{ github.event.inputs.competitor_days || '60' }} --out live/competitor_g2b_export.json

      # 경쟁사 홈페이지 비로그인 공개 화면의 진행중 이벤트 목록만 읽는다(robots.txt 확인:
      # teacherville.co.kr, teacher.i-scream.co.kr, t.vivasam.com 모두 Allow: / - 자동화 허용).
      - name: 경쟁사 홈페이지 콘텐츠 스크레이핑
        timeout-minutes: 10
        continue-on-error: true
        run: python competitor_content_scrape.py

      # 금융위원회 공시 재무정보(GetFinaStatInfoService_V2) - 상장/외감대상 법인만 조회됨.
      # 법인등록번호(crno)는 스크립트에 고정값으로 미리 조회해뒀음(회사명 매칭에 매일 의존하지 않음).
      - name: 경쟁사 재무정보 export (금융위원회 공시)
        continue-on-error: true
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python competitor_finance_export.py --out live/competitor_finance_export.json

      # briefings/*.json(수동/자동으로 추가되는 일일 브리핑 데이터)을 신문 지면으로 렌더링.
      # 데이터가 없으면 아무것도 만들지 않고 넘어가므로 하위 호환된다.
      - name: 조간 브리핑 신문 지면 생성
        continue-on-error: true
        run: python build_news_briefing.py briefings live/news

      # 비상 영업용 앱(v-edu-board) 뉴스 위젯이 읽는 공개 JSON (api/news/*.json, 명세: docs/NEWS_API.md)
      # Gemini: 최신 브리핑 3줄 요약·영업 한마디·키워드(history/news_ai.jsonl, 호당 1회 호출)
      - name: 조간 브리핑 AI 요약 (Gemini)
        timeout-minutes: 3
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_ai.py briefings

      - name: 뉴스 공개 JSON(API) 생성
        continue-on-error: true
        run: python news_api_export.py briefings live/api/news

      # 연수 주제 수요 분석용 입찰공고(연수 일반 키워드) - history/training_bids.jsonl 에 누적.
      # 누적이 비어 있으면 스크립트가 알아서 12개월을 백필하고, 이후엔 최근 45일만 겹쳐 조회한다.
      - name: 연수 입찰공고 누적 (2027 연수 개발 추천용)
        timeout-minutes: 30
        continue-on-error: true
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python training_topics.py fetch --days 45

      # 계약정보(용역): 수의·협상계약까지 포함한 경쟁사·자사 B2G 계약 이력 - history/competitor_contracts.jsonl 누적
      - name: 경쟁사 계약정보 누적 (수의계약 포함)
        timeout-minutes: 25
        continue-on-error: true
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python competitor_contract_export.py --days 60 --out live/competitor_contract_export.json

      # 학교알리미 공시(교원·학생 수) - AI 중점·선도학교에 붙인다. SCHOOLINFO_KEY 시크릿이 없으면 건너뜀
      - name: 학교알리미 교원·학생 수
        timeout-minutes: 45
        continue-on-error: true
        env:
          SCHOOLINFO_KEY: ${{ secrets.SCHOOLINFO_KEY }}
        run: python schoolinfo_export.py live/schoolinfo_export.json

      # 지방교육재정알리미: 교육청 교원 연수 세출 (1단계: 서비스 목록 진단 -> history/eduinfo_status.json)
      - name: 지방교육재정알리미 교원 연수 세출
        timeout-minutes: 10
        continue-on-error: true
        env:
          EDUINFO_KEY: ${{ secrets.EDUINFO_KEY }}
        run: python eduinfo_export.py live/eduinfo_export.json

      # 기상청 단기예보(공공데이터포털 계정 공용 키) - 대시보드 머리말 날씨
      - name: 주요 도시 날씨
        timeout-minutes: 5
        continue-on-error: true
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python weather_export.py live/weather.json

      # 한국관광공사 관광정보 - 17개 시도 숙박·연수·회의 시설(집합연수 장소 섭외)
      - name: 집합연수 장소(관광공사)
        timeout-minutes: 8
        continue-on-error: true
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: python tour_export.py live/tour_venues.json

      # Gemini: 연수 입찰 첨부(제안요청서·과업지시서) 구조화 - 하루 최대 8건, 결과는 history 에 누적
      - name: 제안요청서 AI 분석 (Gemini)
        timeout-minutes: 12
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python rfp_analysis.py

      - name: 통합 대시보드 조합
        id: combine
        continue-on-error: true
        run: python combine_dashboard.py dashboard_template.html live/neis_dashboard_full.html

      # Gemini로 '오늘의 AI 브리핑' 생성 후 대시보드를 한 번 더 조합(조합 결과를 입력으로 쓰기 때문)
      - name: 오늘의 AI 브리핑 (Gemini)
        if: steps.combine.outcome == 'success'
        timeout-minutes: 8
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python ai_insights.py live/ai_insights.json || true   # 화면 맨 위라 먼저(무료 한도 소진 전에)
          python ai_drafts.py live/ai_drafts.json || true
          if [ -f live/ai_insights.json ] || [ -f live/ai_drafts.json ]; then python combine_dashboard.py dashboard_template.html live/neis_dashboard_full.html; fi

      - name: 주간 보고(최근 7일) 생성
        if: steps.combine.outcome == 'success'
        continue-on-error: true
        run: python weekly_digest.py live/weekly.html live/weekly_mail.txt

      - name: 입찰 마감일 .ics 캘린더 피드 생성
        if: steps.combine.outcome == 'success'
        continue-on-error: true
        run: python ics_feed.py live/_ai_rows_count.json live/g2b_deadlines.ics

      - name: PDF 리포트 생성
        continue-on-error: true
        run: python pdf_report.py live/weekly_report.pdf

      - name: 일별 히스토리 누적 (history/daily_stats.jsonl)
        if: steps.combine.outcome == 'success' && steps.healthcheck.outputs.healthy == 'true'
        continue-on-error: true
        run: python history_tracker.py

      - name: 히스토리 커밋 (있으면)
        if: steps.combine.outcome == 'success' && steps.healthcheck.outputs.healthy == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/daily_stats.jsonl history/competitor_wins.jsonl history/competitor_content_snapshot.json
          for f in history/training_bids.jsonl history/training_bids.rules history/order_plans.jsonl history/competitor_contracts.jsonl history/competitor_contracts_status.json history/schoolinfo_status.json history/schoolinfo_market.json history/pipeline_status.json history/pipeline_comms_status.json history/banner_market_status.json history/eduinfo_status.json history/ai_insights_status.json history/ai_insights_last.json history/rfp_analysis.jsonl history/ai_drafts_cache.json history/news_ai.jsonl history/tour_venues.json history/tour_status.json; do if [ -f "$f" ]; then git add "$f"; fi; done   # 수집 실패로 파일이 없어도 위 지표 커밋은 진행
          git diff --cached --quiet || git commit -m "chore: 일일 지표 누적 $(TZ=Asia/Seoul date +%F)"
          # 2026-09-27: 카탈로그 크롤링 커밋과 겹쳐 push가 거부돼 그날 지표가 유실됐다.
          # 서로 다른 파일만 건드리므로 rebase 후 올리면 충돌 없이 합쳐진다.
          git pull --rebase origin main && git push || true

      - name: prepare pages artifact
        run: |
          mkdir -p _site
          cp live/dashboard_live.html _site/index.html
          if [ -f live/neis_dashboard_full.html ]; then
            mkdir -p _site/full
            cp live/neis_dashboard_full.html _site/full/index.html
          fi
          # 2026 AI 중점·디지털 선도학교 명단 엑셀(대시보드 'AI 중점·선도학교' 탭의 내려받기)
          if [ -f static_data/ai_schools_2026.xlsx ]; then
            mkdir -p _site/full
            cp static_data/ai_schools_2026.xlsx _site/full/ai_schools_2026.xlsx
            cp live/b2s_schools.csv _site/full/b2s_schools.csv 2>/dev/null || true
          fi
          if [ -f live/weekly.html ]; then
            mkdir -p _site/full
            cp live/weekly.html _site/full/weekly.html
            cp live/weekly_mail.txt _site/full/weekly_mail.txt 2>/dev/null || true
          fi
          if [ -f live/g2b_deadlines.ics ]; then
            mkdir -p _site/full
            cp live/g2b_deadlines.ics _site/full/calendar.ics
          fi
          if [ -f live/weekly_report.pdf ]; then
            mkdir -p _site/full
            cp live/weekly_report.pdf _site/full/report.pdf
          fi
          if [ -d live/news ]; then
            cp -r live/news _site/news
          fi
          if [ -d live/api ]; then
            cp -r live/api _site/api
          fi
          cp -r widget _site/widget   # 외부 앱 삽입용 뉴스 위젯(정적 파일)
          python add_noindex.py _site   # 검색엔진 비노출(링크 받은 사람만)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.data_healthy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
