name: 나라장터 대시보드 자동 갱신·배포

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00 전날)
  workflow_dispatch: {}
  push:
    branches: [main]
    # 브리핑 데이터만 바뀐 푸시는 news.yml 이 전담한다. 두 워크플로가 같은 push 로
    # 동시에 뜨면 concurrency 그룹(pages)에서 뒤에 대기하던 쪽이 취소되는데,
    # 실측 결과 매번 news.yml 이 취소되고 무거운 이 파이프라인이 대신 배포했다.
    # (2026-08-16: news.yml #4~#7 전부 cancelled)
    # 브리핑·루틴 데이터만 바뀐 푸시는 news.yml(경량 경로)이 전담한다. 두 워크플로가
    # 같은 push 로 동시에 뜨면 concurrency 그룹(pages)에서 뒤에 대기하던 쪽이 취소된다.
    paths-ignore:
      - "briefings/**"
      - "routines/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      data_healthy: ${{ steps.healthcheck.outputs.healthy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: |
          pip install openpyxl reportlab PublicDataReader playwright google-auth
          sudo apt-get update -y && sudo apt-get install -y fonts-nanum
          python -m playwright install --with-deps chromium

      - name: prepare local config (service key comes from secret at runtime)
        run: cp g2b_config.example.json g2b_config.json

      - name: fetch G2B data + build 기존 단독 대시보드
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python run_pipeline.py

      # 2026-08-03 실측: data.go.kr(나라장터 API)가 4시간 넘게 응답 없이 타임아웃돼
      # 입찰공고/사전규격/낙찰정보가 전부 0건으로 수집됐는데, continue-on-error 때문에
      # 그 빈 데이터가 그대로 배포돼 전날까지 멀쩡하던 사이트가 통째로 비어버렸다.
      # 재발 방지: 오늘 수집량이 비정상적으로 적으면(임계치 미만) 배포 자체를 건너뛰고
      # 어제까지 이미 떠 있는 GitHub Pages 콘텐츠를 그대로 둔다(live/는 gitignore라
      # "어제 버전으로 롤백"할 파일이 없으므로, 배포를 안 하는 것 자체가 롤백이 된다).
      - name: G2B 데이터 건전성 체크
        id: healthcheck
        run: python check_g2b_health.py

      # ---- 통합 대시보드(나이스+G2B+선도학교+자사파이프라인) 확장 파이프라인 ----
      # NEIS_KEY / ODCLOUD_KEY 시크릿이 없으면 이 스텝들은 개별적으로 실패해도
      # continue-on-error로 넘어가고, 기존 단독 대시보드만 배포된다(하위 호환).
      - name: G2B 분석 데이터 export (analytics.py 재사용, 스크레이핑 없음)
        continue-on-error: true
        run: python g2b_full_export.py live/full_live.json live/g2b_full_export.json

      - name: 나이스 학교수 + AI 선도학교(odcloud) export
        continue-on-error: true
        env:
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
          ODCLOUD_KEY: ${{ secrets.ODCLOUD_KEY }}
        run: python neis_full_export.py live/neis_full_export.json

      - name: 자사 영업 파이프라인 export (안전 필드만, 담당자 익명화)
        continue-on-error: true
        env:
          GOOGLE_SHEETS_SA_JSON: ${{ secrets.GOOGLE_SHEETS_SA_JSON }}
        run: python own_pipeline_export.py live/own_pipeline_export.json

      - name: KOSIS 시도교육청 교육재정 규모 export
        continue-on-error: true
        run: python kosis_edu_finance.py "${{ secrets.KOSIS_KEY }}" live/kosis_edu_finance.json

      # 경쟁사(티처빌/아이스크림/비바샘/한교원) 나라장터 낙찰 - history/competitor_wins.jsonl에
      # 누적(git 추적, live/처럼 매일 지워지지 않음). 매일은 최근 60일치만 조회(낙찰 데이터가
      # 뒤늦게 등록되는 경우를 감안해 겹치게), 대시보드에는 누적 전체를 집계해 보여준다.
      - name: 경쟁사 나라장터 낙찰 매트릭스 export (누적)
        continue-on-error: true
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python competitor_g2b_export.py --days 60 --out live/competitor_g2b_export.json

      # 경쟁사 홈페이지 비로그인 공개 화면의 진행중 이벤트 목록만 읽는다(robots.txt 확인:
      # teacherville.co.kr, teacher.i-scream.co.kr, t.vivasam.com 모두 Allow: / - 자동화 허용).
      - name: 경쟁사 홈페이지 콘텐츠 스크레이핑
        continue-on-error: true
        run: python competitor_content_scrape.py

      # 금융위원회 공시 재무정보(GetFinaStatInfoService_V2) - 상장/외감대상 법인만 조회됨.
      # 법인등록번호(crno)는 스크립트에 고정값으로 미리 조회해뒀음(회사명 매칭에 매일 의존하지 않음).
      - name: 경쟁사 재무정보 export (금융위원회 공시)
        continue-on-error: true
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python competitor_finance_export.py --out live/competitor_finance_export.json

      # briefings/*.json(수동/자동으로 추가되는 일일 브리핑 데이터)을 신문 지면으로 렌더링.
      # 데이터가 없으면 아무것도 만들지 않고 넘어가므로 하위 호환된다.
      - name: 조간 브리핑 신문 지면 생성
        continue-on-error: true
        run: python build_news_briefing.py briefings live/news

      # 루틴 7종을 비서 7인과의 대화(아이메시지 UI)로 보여주는 허브. 외부 API를
      # 호출하지 않고 routines/team.json 만 읽으므로 데이터 장애와 무관하다.
      - name: 루틴 허브 생성
        continue-on-error: true
        run: python build_routine_hub.py routines/team.json live/routines

      - name: 통합 대시보드 조합
        id: combine
        continue-on-error: true
        run: python combine_dashboard.py dashboard_template.html live/neis_dashboard_full.html

      - name: 입찰 마감일 .ics 캘린더 피드 생성
        if: steps.combine.outcome == 'success'
        continue-on-error: true
        run: python ics_feed.py live/_ai_rows_count.json live/g2b_deadlines.ics

      - name: PDF 리포트 생성
        continue-on-error: true
        run: python pdf_report.py live/weekly_report.pdf

      - name: 일별 히스토리 누적 (history/daily_stats.jsonl)
        if: steps.combine.outcome == 'success' && steps.healthcheck.outputs.healthy == 'true'
        continue-on-error: true
        run: python history_tracker.py

      - name: 히스토리 커밋 (있으면)
        if: steps.combine.outcome == 'success' && steps.healthcheck.outputs.healthy == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/daily_stats.jsonl history/competitor_wins.jsonl
          git diff --cached --quiet || git commit -m "chore: 일일 지표 누적 $(date -u +%F)"
          git push || true

      - name: prepare pages artifact
        run: |
          mkdir -p _site
          cp live/dashboard_live.html _site/index.html
          if [ -f live/neis_dashboard_full.html ]; then
            mkdir -p _site/full
            cp live/neis_dashboard_full.html _site/full/index.html
          fi
          if [ -f live/g2b_deadlines.ics ]; then
            mkdir -p _site/full
            cp live/g2b_deadlines.ics _site/full/calendar.ics
          fi
          if [ -f live/weekly_report.pdf ]; then
            mkdir -p _site/full
            cp live/weekly_report.pdf _site/full/report.pdf
          fi
          if [ -d live/news ]; then
            cp -r live/news _site/news
          fi
          if [ -d live/routines ]; then
            cp -r live/routines _site/routines
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.data_healthy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
