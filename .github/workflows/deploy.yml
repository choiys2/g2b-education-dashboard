name: 나라장터 대시보드 자동 갱신·배포

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (UTC 21:00 전날)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dependencies
        run: pip install openpyxl

      - name: prepare local config (service key comes from secret at runtime)
        run: cp g2b_config.example.json g2b_config.json

      - name: fetch G2B data + build dashboard
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: python run_pipeline.py

      - name: prepare pages artifact
        run: |
          mkdir -p _site
          cp live/dashboard_live.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
