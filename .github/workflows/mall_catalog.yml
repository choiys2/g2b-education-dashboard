name: 교사몰 상품·교사 트렌드 수집

on:
  schedule:
    - cron: "30 20 * * 0"   # 매주 월요일 05:30 KST - 06:00 대시보드 배포 전에 끝나도록
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      # 공개 목록만, robots.txt 허용 경로만 연다(스크립트가 실행 때마다 재확인).
      - name: 티처몰 상품 동향 수집(아이스크림몰은 접속 상태만 기록)
        run: python competitor_mall_scrape.py
      # 키가 없으면 해당 출처만 건너뛴다(Secrets: YOUTUBE_API_KEY).
      - name: 교사 트렌드 수집(유튜브 교사 채널)
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python teacher_creator_trends.py
      # 키가 없으면 해당 출처만 건너뛴다(Secrets: NAVER_CLIENT_ID, NAVER_CLIENT_SECRET, KAKAO_REST_KEY).
      - name: 교사 관심사 수집(네이버 데이터랩·쇼핑인사이트·블로그/카페, 다음 블로그/카페)
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python teacher_interest_trends.py
      # 3사 개인정보처리방침의 수탁사·제3자 제공처(개정 때만 바뀜 - 매주 비교해 신규·제외 기록)
      - name: 처리방침 협력사 수집
        continue-on-error: true
        run: python policy_partners_scrape.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch history/competitor_mall_new.jsonl
          git add history/competitor_mall_catalog.json history/competitor_mall_new.jsonl
          [ -f history/teacher_creator_trends.json ] && git add history/teacher_creator_trends.json
          [ -f history/teacher_interest_trends.json ] && git add history/teacher_interest_trends.json
          [ -f history/policy_partners.json ] && git add history/policy_partners.json
          git diff --cached --quiet || git commit -m "chore: 교사몰 상품 동향 수집 $(date -u +%F)"
          git pull --rebase origin main
          git push
