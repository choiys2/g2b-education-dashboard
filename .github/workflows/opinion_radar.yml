name: 교과서 선정 여론 레이더(네이버 블로그·카페)

# 관리 > PDF 전략 ⑦: 출판사별 교과서·교사용 콘텐츠 언급량과 비상 관련 최근 글 제목(글쓴이·본문 저장 안 함)
on:
  schedule:
    - cron: "50 20 * * 0"   # 매주 월 05:50 KST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: opinion-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 스크랩
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python opinion_radar.py
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/opinion_radar.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: 선정 여론 레이더 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
